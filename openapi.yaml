components:
  securitySchemes:
    bearerAuth:
      type: "http"
      scheme: "bearer"
      bearerFormat: "JWT"
      description: "Proporcione el token en formato Bearer (ej. Bearer eyJhbGci...)"
  schemas:
    UsuarioSimple:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        nombre:
          type: string
          example: "Juan"
        apellido:
          type: string
          example: "Pérez"
        email:
          type: string
          format: email
          example: "juan.perez@ejemplo.com"
        rol:
          type: string
          example: "TECNICO"

    Usuario:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        nombre:
          type: string
          example: "Juan"
        apellido:
          type: string
          example: "Pérez"
        rol:
          type: string
          example: "TECNICO"
        email:
          type: string
          format: email
          example: "juan.perez@ejemplo.com"
        correoSecundario:
          type: string
          format: email
          nullable: true
          description: "Correo de contacto alterno (opcional)"
          example: "juan.personal@ejemplo.com"
        telefono:
          type: string
          example: "2281234567"
        password:
          type: string
          writeOnly: true
          description: "Contraseña del usuario (encriptada con bcrypt). Solo se envía al crear/actualizar; nunca se incluye en las respuestas de la API."
          example: "$2a$10$X729x7b/H5gIq2pP5uO7eOd8Z..."
        fechaCreacion:
          type: string
          format: date-time
          example: "2026-06-24T12:00:00.000Z"
        activo:
          type: boolean
          example: true
        departamentoId:
          type: string
          format: uuid
          example: "a1b2c3d4-e5f6-7a8b-9c0d-1e2f3a4b5c6d"

    UsuarioWithDepartamento:
      allOf:
        - $ref: '#/components/schemas/Usuario'
        - type: object
          properties:
            departamento:
              $ref: '#/components/schemas/Departamento'

    Departamento:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "a1b2c3d4-e5f6-7a8b-9c0d-1e2f3a4b5c6d"
        nombre:
          type: string
          example: "Recursos Humanos"

    Ticket:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "876e5432-b89e-12d3-a456-426614174999"
        creadoPorId:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        asignadoAId:
          type: string
          format: uuid
          nullable: true
          example: "123e4567-e89b-12d3-a456-426614174001"
        asunto:
          type: string
          example: "Falla en equipo de cómputo"
        fechaCreacion:
          type: string
          format: date-time
          example: "2026-06-24T13:30:00.000Z"
        fechaCierre:
          type: string
          format: date-time
          nullable: true
          description: "Fecha y hora en que el ticket pasó a estatus CERRADO. Se gestiona automáticamente: se registra al cerrar y se limpia si se reabre."
          example: "2026-06-25T09:15:00.000Z"
        status:
          $ref: '#/components/schemas/EstadoTicket'
        descripcion:
          type: string
          example: "La computadora no enciende tras un apagón"
        servicioId:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174002"
        maquinaId:
          type: string
          format: uuid
          nullable: true
          description: "ID de la máquina reportada (opcional)"
          example: "m1n2o3p4-q5r6-7s8t-9u0v-1w2x3y4z5a6b"
        notaCierre:
          type: string
          nullable: true
          description: "Reporte de cierre escrito por el técnico. Obligatorio al cambiar status a CERRADO."
          example: "Se reemplazó el cable de poder dañado y se verificó el encendido correcto del equipo."

    TicketWithRelations:
      allOf:
        - $ref: '#/components/schemas/Ticket'
        - type: object
          properties:
            creadoPor:
              $ref: '#/components/schemas/UsuarioWithDepartamento'
            asignadoA:
              allOf:
                - $ref: '#/components/schemas/UsuarioWithDepartamento'
              nullable: true
            servicio:
              $ref: '#/components/schemas/CatServicios'
            maquina:
              allOf:
                - $ref: '#/components/schemas/MaquinaWithDepartment'
              nullable: true

    Maquina:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "m1n2o3p4-q5r6-7s8t-9u0v-1w2x3y4z5a6b"
        serviceTag:
          type: string
          example: "ST123456"
        modelo:
          type: string
          example: "OptiPlex 7090"
        IP:
          type: string
          example: "192.168.1.50"
        numeroSerie:
          type: string
          example: "NS987654321"
        departamentoId:
          type: string
          format: uuid
          example: "a1b2c3d4-e5f6-7a8b-9c0d-1e2f3a4b5c6d"

    MaquinaWithDepartment:
      allOf:
        - $ref: '#/components/schemas/Maquina'
        - type: object
          properties:
            departamento:
              $ref: '#/components/schemas/Departamento'

    CatServicios:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174002"
        nombre:
          type: string
          example: "Soporte Técnico Remoto"
        tipo:
          $ref: '#/components/schemas/TipoServicios'

    CatServiceWithTickets:
      allOf:
        - $ref: '#/components/schemas/CatServicios'
        - type: object
          properties:
            tickets:
              type: array
              items:
                $ref: '#/components/schemas/Ticket'

    EstadoTicket:
      type: string
      enum:
        - "ABIERTO"
        - "EN_PROGRESO"
        - "ATENDIDO"
        - "CERRADO"
      example: "ABIERTO"

    TipoServicios:
      type: string
      enum:
        - "SERVICIO"
        - "TELEFONIA"
        - "HARDWARE"
        - "SOFTWARE"
        - "RED"
        - "IMPRESION"
      example: "SOFTWARE"

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "Descripción detallada del error de la petición."
        error:
          type: string
          description: "Mensaje del error técnico o de la base de datos (opcional)."
          example: "Prisma error or technical details."
